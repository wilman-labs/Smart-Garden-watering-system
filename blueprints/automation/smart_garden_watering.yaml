          Final Moisture : {{ z4_moisture_val | round(0) | int }}%
        {% elif zone_4_moisture_sensor != '' %}
          Final Moisture : sensor unavailable
        {% else %}
          Final Moisture : no sensor
        {% endif %}

  # ════════════════════════════════════════════════════════════════
  # EXECUTE ZONES — PARALLEL
  # ════════════════════════════════════════════════════════════════

  - alias: "Execute watering — parallel"
    parallel:
      - sequence:
          - alias: "Zone 1 — water if due"
            choose:
              - conditions:
                  - condition: template
                    value_template: "{{ z1_should_water }}"
                sequence:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: "{{ zone_1_valve }}"
                  - delay:
                      seconds: 2
                  - alias: "Zone 1 — check valve responded"
                    variables:
                      z1_valve_state: "{{ states(zone_1_valve) }}"
                      z1_valve_offline: "{{ z1_valve_state in ['unavailable', 'unknown'] }}"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ z1_valve_offline }}"
                        sequence:
                          - service: homeassistant.turn_off
                            target:
                              entity_id: "{{ zone_1_valve }}"
                          - variables:
                              z1_should_water: false
                              z1_result: "⚠️ OFFLINE — valve did not respond ({{ zone_1_valve }})"
                    default:
                      - delay:
                          minutes: "{{ z1_duration | int }}"
                      - service: homeassistant.turn_off
                        target:
                          entity_id: "{{ zone_1_valve }}"
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ zone_1_last_watered != '' }}"
                            sequence:
                              - service: input_datetime.set_datetime
                                target:
                                  entity_id: "{{ zone_1_last_watered }}"
                                data:
                                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - sequence:
          - alias: "Zone 2 — water if due"
            choose:
              - conditions:
                  - condition: template
                    value_template: "{{ z2_should_water }}"
                sequence:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: "{{ zone_2_valve }}"
                  - delay:
                      seconds: 2
                  - alias: "Zone 2 — check valve responded"
                    variables:
                      z2_valve_state: "{{ states(zone_2_valve) }}"
                      z2_valve_offline: "{{ z2_valve_state in ['unavailable', 'unknown'] }}"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ z2_valve_offline }}"
                        sequence:
                          - service: homeassistant.turn_off
                            target:
                              entity_id: "{{ zone_2_valve }}"
                          - variables:
                              z2_should_water: false
                              z2_result: "⚠️ OFFLINE — valve did not respond ({{ zone_2_valve }})"
                    default:
                      - delay:
                          minutes: "{{ z2_duration | int }}"
                      - service: homeassistant.turn_off
                        target:
                          entity_id: "{{ zone_2_valve }}"
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ zone_2_last_watered != '' }}"
                            sequence:
                              - service: input_datetime.set_datetime
                                target:
                                  entity_id: "{{ zone_2_last_watered }}"
                                data:
                                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - sequence:
          - alias: "Zone 3 — water if due"
            choose:
              - conditions:
                  - condition: template
                    value_template: "{{ z3_should_water }}"
                sequence:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: "{{ zone_3_valve }}"
                  - delay:
                      seconds: 2
                  - alias: "Zone 3 — check valve responded"
                    variables:
                      z3_valve_state: "{{ states(zone_3_valve) }}"
                      z3_valve_offline: "{{ z3_valve_state in ['unavailable', 'unknown'] }}"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ z3_valve_offline }}"
                        sequence:
                          - service: homeassistant.turn_off
                            target:
                              entity_id: "{{ zone_3_valve }}"
                          - variables:
                              z3_should_water: false
                              z3_result: "⚠️ OFFLINE — valve did not respond ({{ zone_3_valve }})"
                    default:
                      - delay:
                          minutes: "{{ z3_duration | int }}"
                      - service: homeassistant.turn_off
                        target:
                          entity_id: "{{ zone_3_valve }}"
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ zone_3_last_watered != '' }}"
                            sequence:
                              - service: input_datetime.set_datetime
                                target:
                                  entity_id: "{{ zone_3_last_watered }}"
                                data:
                                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - sequence:
          - alias: "Zone 4 — water if due"
            choose:
              - conditions:
                  - condition: template
                    value_template: "{{ z4_should_water }}"
                sequence:
                  - service: homeassistant.turn_on
                    target:
                      entity_id: "{{ zone_4_valve }}"
                  - delay:
                      seconds: 2
                  - alias: "Zone 4 — check valve responded"
                    variables:
                      z4_valve_state: "{{ states(zone_4_valve) }}"
                      z4_valve_offline: "{{ z4_valve_state in ['unavailable', 'unknown'] }}"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ z4_valve_offline }}"
                        sequence:
                          - service: homeassistant.turn_off
                            target:
                              entity_id: "{{ zone_4_valve }}"
                          - variables:
                              z4_should_water: false
                              z4_result: "⚠️ OFFLINE — valve did not respond ({{ zone_4_valve }})"
                    default:
                      - delay:
                          minutes: "{{ z4_duration | int }}"
                      - service: homeassistant.turn_off
                        target:
                          entity_id: "{{ zone_4_valve }}"
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ zone_4_last_watered != '' }}"
                            sequence:
                              - service: input_datetime.set_datetime
                                target:
                                  entity_id: "{{ zone_4_last_watered }}"
                                data:
                                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

  - alias: "All zones — update moisture lines post-watering"
    variables:
      z1_moisture_end: >-
        {% if zone_1_moisture_sensor != '' and
              states(zone_1_moisture_sensor) not in ['unknown', 'unavailable'] %}
          {{ states(zone_1_moisture_sensor) | float(-1) }}
        {% else %}
          -1
        {% endif %}
      z1_moisture_line: >-
        {% if z1_skip_moisture | bool(false) %}
        {% elif z1_should_water and zone_1_moisture_sensor != '' and z1_moisture_val >= 0 %}
          Final Moisture : {{ z1_moisture_val | round(0) | int }}% → {{ z1_moisture_end | round(0) | int }}%
        {% elif zone_1_moisture_sensor != '' and z1_moisture_val >= 0 %}
          Final Moisture : {{ z1_moisture_val | round(0) | int }}%
        {% elif zone_1_moisture_sensor != '' %}
          Final Moisture : sensor unavailable
        {% else %}
          Final Moisture : no sensor
        {% endif %}
      z2_moisture_end: >-
        {% if zone_2_moisture_sensor != '' and
              states(zone_2_moisture_sensor) not in ['unknown', 'unavailable'] %}
          {{ states(zone_2_moisture_sensor) | float(-1) }}
        {% else %}
          -1
        {% endif %}
      z2_moisture_line: >-
        {% if z2_skip_moisture | bool(false) %}
        {% elif z2_should_water and zone_2_moisture_sensor != '' and z2_moisture_val >= 0 %}
          Final Moisture : {{ z2_moisture_val | round(0) | int }}% → {{ z2_moisture_end | round(0) | int }}%
        {% elif zone_2_moisture_sensor != '' and z2_moisture_val >= 0 %}
          Final Moisture : {{ z2_moisture_val | round(0) | int }}%
        {% elif zone_2_moisture_sensor != '' %}
          Final Moisture : sensor unavailable
        {% else %}
