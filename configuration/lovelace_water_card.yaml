# =============================================================================
# Lovelace Water Usage Dashboard Card — lovelace_water_card.yaml
# =============================================================================
#
# USAGE
# -----
# Paste the YAML below into a Lovelace dashboard card via the HA UI:
#   1. Open your dashboard → Edit → + Add Card → Manual card
#   2. Paste the YAML below and save.
#
# Or reference this file from your ui-lovelace.yaml if using YAML mode.
# This card intentionally uses only the read-only sensor.* mirror entities from
# water_tracking.yaml so the values display without editable number boxes.
#
# =============================================================================

type: vertical-stack
cards:

  # Title banner
  - type: markdown
    content: |
      ## 💧 Garden Water Usage
      Read-only per-run usage and running totals for all four irrigation zones.

  # 7-day history of per-run litres per zone
  - type: history-graph
    title: "Last-Run Litres per Zone (7 days)"
    hours_to_show: 168
    entities:
      - entity: sensor.zone_1_last_run_litres
        name: Zone 1
      - entity: sensor.zone_2_last_run_litres
        name: Zone 2
      - entity: sensor.zone_3_last_run_litres
        name: Zone 3
      - entity: sensor.zone_4_last_run_litres
        name: Zone 4

  # Read-only mirrored totals and last-run values
  - type: entities
    title: "Water Usage Summary"
    entities:
      - entity: sensor.zone_1_last_run_litres
        name: "Zone 1 — Last Run Litres"
        icon: mdi:water
      - entity: sensor.zone_2_last_run_litres
        name: "Zone 2 — Last Run Litres"
        icon: mdi:water
      - entity: sensor.zone_3_last_run_litres
        name: "Zone 3 — Last Run Litres"
        icon: mdi:water
      - entity: sensor.zone_4_last_run_litres
        name: "Zone 4 — Last Run Litres"
        icon: mdi:water
      - type: divider
      - entity: sensor.zone_1_total_litres
        name: "Zone 1 — Total Litres"
        icon: mdi:water-outline
      - entity: sensor.zone_2_total_litres
        name: "Zone 2 — Total Litres"
        icon: mdi:water-outline
      - entity: sensor.zone_3_total_litres
        name: "Zone 3 — Total Litres"
        icon: mdi:water-outline
      - entity: sensor.zone_4_total_litres
        name: "Zone 4 — Total Litres"
        icon: mdi:water-outline
