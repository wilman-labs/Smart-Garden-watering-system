              states(zone_3_moisture_sensor) not in ['unknown', 'unavailable'] %}
          {{ states(zone_3_moisture_sensor) | float(-1) }}
        {% else %}
          -1
        {% endif %}
      z3_moisture_line: >-
        {% if z3_skip_moisture | bool(false) %}
        {% elif z3_should_water and zone_3_moisture_sensor != '' and z3_moisture_val >= 0 %}
          Final Moisture : {{ z3_moisture_val | round(0) | int }}% → {{ z3_moisture_end | round(0) | int }}%
        {% elif zone_3_moisture_sensor != '' and z3_moisture_val >= 0 %}
          Final Moisture : {{ z3_moisture_val | round(0) | int }}%
        {% elif zone_3_moisture_sensor != '' %}
          Final Moisture : sensor unavailable
        {% else %}
          Final Moisture : no sensor
        {% endif %}
      z4_moisture_end: >-
        {% if zone_4_moisture_sensor != '' and
              states(zone_4_moisture_sensor) not in ['unknown', 'unavailable'] %}
          {{ states(zone_4_moisture_sensor) | float(-1) }}
        {% else %}
          -1
        {% endif %}
      z4_moisture_line: >-
        {% if z4_skip_moisture | bool(false) %}
        {% elif z4_should_water and zone_4_moisture_sensor != '' and z4_moisture_val >= 0 %}
          Final Moisture : {{ z4_moisture_val | round(0) | int }}% → {{ z4_moisture_end | round(0) | int }}%
        {% elif zone_4_moisture_sensor != '' and z4_moisture_val >= 0 %}
          Final Moisture : {{ z4_moisture_val | round(0) | int }}%
        {% elif zone_4_moisture_sensor != '' %}
          Final Moisture : sensor unavailable
        {% else %}
