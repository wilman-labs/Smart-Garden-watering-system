            {% endif %}
          z4_eve_moisture_line: >-
            {% if z4_eve_sensor_ok %}
              Moisture : {{ z4_eve_moisture_val | round(0) | int }}%
            {% elif zone_4_moisture_sensor != '' %}
              Moisture : sensor unavailable
            {% else %}
              Moisture : no sensor
            {% endif %}

      # ════════════════════════════════════════════════════════════
      # EXECUTE EVENING ZONES — PARALLEL
      # ════════════════════════════════════════════════════════════

      - alias: "Execute evening watering — parallel"
        parallel:
          - sequence:
              - alias: "Zone 1 — evening water if needed"
                choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ z1_eve_should_water }}"
                    sequence:
                      - service: homeassistant.turn_on
                        target:
                          entity_id: "{{ zone_1_valve }}"
                      - delay:
                          seconds: 2
                      - alias: "Zone 1 — check valve responded (evening)"
                        variables:
                          z1_eve_valve_offline: "{{ states(zone_1_valve) in ['unavailable', 'unknown'] }}"
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ z1_eve_valve_offline }}"
                            sequence:
                              - service: homeassistant.turn_off
                                target:
                                  entity_id: "{{ zone_1_valve }}"
                              - variables:
                                  z1_eve_should_water: false
                                  z1_eve_result: "⚠️ OFFLINE — valve did not respond ({{ zone_1_valve }})"
                        default:
                          - delay:
                              minutes: "{{ z1_eve_duration | int }}"
                          - service: homeassistant.turn_off
                            target:
                              entity_id: "{{ zone_1_valve }}"
          - sequence:
              - alias: "Zone 2 — evening water if needed"
                choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ z2_eve_should_water }}"
                    sequence:
                      - service: homeassistant.turn_on
                        target:
                          entity_id: "{{ zone_2_valve }}"
                      - delay:
                          seconds: 2
                      - alias: "Zone 2 — check valve responded (evening)"
                        variables:
                          z2_eve_valve_offline: "{{ states(zone_2_valve) in ['unavailable', 'unknown'] }}"
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ z2_eve_valve_offline }}"
                            sequence:
                              - service: homeassistant.turn_off
                                target:
                                  entity_id: "{{ zone_2_valve }}"
                              - variables:
                                  z2_eve_should_water: false
                                  z2_eve_result: "⚠️ OFFLINE — valve did not respond ({{ zone_2_valve }})"
                        default:
                          - delay:
                              minutes: "{{ z2_eve_duration | int }}"
                          - service: homeassistant.turn_off
                            target:
                              entity_id: "{{ zone_2_valve }}"
          - sequence:
              - alias: "Zone 3 — evening water if needed"
                choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ z3_eve_should_water }}"
                    sequence:
                      - service: homeassistant.turn_on
                        target:
                          entity_id: "{{ zone_3_valve }}"
                      - delay:
                          seconds: 2
                      - alias: "Zone 3 — check valve responded (evening)"
                        variables:
                          z3_eve_valve_offline: "{{ states(zone_3_valve) in ['unavailable', 'unknown'] }}"
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ z3_eve_valve_offline }}"
                            sequence:
                              - service: homeassistant.turn_off
                                target:
                                  entity_id: "{{ zone_3_valve }}"
                              - variables:
                                  z3_eve_should_water: false
                                  z3_eve_result: "⚠️ OFFLINE — valve did not respond ({{ zone_3_valve }})"
                        default:
                          - delay:
                              minutes: "{{ z3_eve_duration | int }}"
                          - service: homeassistant.turn_off
                            target:
                              entity_id: "{{ zone_3_valve }}"
          - sequence:
