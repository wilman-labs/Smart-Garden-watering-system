# =============================================================================
# Water Usage Tracking — Helpers (water_tracking.yaml)
# =============================================================================
#
# DROP-IN FILE — NO EDITS REQUIRED
#
# This file creates the input_number helpers used by the blueprint to store
# water usage data, plus read-only template sensors for Lovelace dashboards.
# Simply include it in your configuration.yaml:
#
#   homeassistant:
#     packages:
#       water_tracking: !include configuration/water_tracking.yaml
#
# Then link the helpers in the blueprint UI under "Water Usage Tracking".
# Use the generated sensor.* entities in dashboards when you want read-only
# display rows instead of editable input_number boxes.
#
# =============================================================================

# ---------------------------------------------------------------------------
# input_number helpers — per-zone litres tracking
# ---------------------------------------------------------------------------
input_number:

  # -- Litres used in the last run (per zone) --
  zone_1_last_litres:
    name: "Zone 1 Last Run Litres"
    min: 0
    max: 10000
    step: 0.1
    mode: box
    unit_of_measurement: "L"
    icon: mdi:water

  zone_2_last_litres:
    name: "Zone 2 Last Run Litres"
    min: 0
    max: 10000
    step: 0.1
    mode: box
    unit_of_measurement: "L"
    icon: mdi:water

  zone_3_last_litres:
    name: "Zone 3 Last Run Litres"
    min: 0
    max: 10000
    step: 0.1
    mode: box
    unit_of_measurement: "L"
    icon: mdi:water

  zone_4_last_litres:
    name: "Zone 4 Last Run Litres"
    min: 0
    max: 10000
    step: 0.1
    mode: box
    unit_of_measurement: "L"
    icon: mdi:water

  # -- Running total litres per zone --
  zone_1_total_litres:
    name: "Zone 1 Total Litres"
    min: 0
    max: 1000000
    step: 0.1
    mode: box
    unit_of_measurement: "L"
    icon: mdi:water-outline

  zone_2_total_litres:
    name: "Zone 2 Total Litres"
    min: 0
    max: 1000000
    step: 0.1
    mode: box
    unit_of_measurement: "L"
    icon: mdi:water-outline

  zone_3_total_litres:
    name: "Zone 3 Total Litres"
    min: 0
    max: 1000000
    step: 0.1
    mode: box
    unit_of_measurement: "L"
    icon: mdi:water-outline

  zone_4_total_litres:
    name: "Zone 4 Total Litres"
    min: 0
    max: 1000000
    step: 0.1
    mode: box
    unit_of_measurement: "L"
    icon: mdi:water-outline

# ---------------------------------------------------------------------------
# template sensors — read-only mirrors for dashboard display
# ---------------------------------------------------------------------------
template:
  - sensor:
      - name: "Zone 1 Last Run Litres"
        unique_id: zone_1_last_run_litres_sensor
        unit_of_measurement: "L"
        device_class: volume
        state_class: measurement
        icon: mdi:water
        state: "{{ states('input_number.zone_1_last_litres') | float(0) }}"

      - name: "Zone 2 Last Run Litres"
        unique_id: zone_2_last_run_litres_sensor
        unit_of_measurement: "L"
        device_class: volume
        state_class: measurement
        icon: mdi:water
        state: "{{ states('input_number.zone_2_last_litres') | float(0) }}"

      - name: "Zone 3 Last Run Litres"
        unique_id: zone_3_last_run_litres_sensor
        unit_of_measurement: "L"
        device_class: volume
        state_class: measurement
        icon: mdi:water
        state: "{{ states('input_number.zone_3_last_litres') | float(0) }}"

      - name: "Zone 4 Last Run Litres"
        unique_id: zone_4_last_run_litres_sensor
        unit_of_measurement: "L"
        device_class: volume
        state_class: measurement
        icon: mdi:water
        state: "{{ states('input_number.zone_4_last_litres') | float(0) }}"

      - name: "Zone 1 Total Litres"
        unique_id: zone_1_total_litres_sensor
        unit_of_measurement: "L"
        device_class: water
        state_class: total_increasing
        icon: mdi:water-outline
        state: "{{ states('input_number.zone_1_total_litres') | float(0) }}"

      - name: "Zone 2 Total Litres"
        unique_id: zone_2_total_litres_sensor
        unit_of_measurement: "L"
        device_class: water
        state_class: total_increasing
        icon: mdi:water-outline
        state: "{{ states('input_number.zone_2_total_litres') | float(0) }}"

      - name: "Zone 3 Total Litres"
        unique_id: zone_3_total_litres_sensor
        unit_of_measurement: "L"
        device_class: water
        state_class: total_increasing
        icon: mdi:water-outline
        state: "{{ states('input_number.zone_3_total_litres') | float(0) }}"

      - name: "Zone 4 Total Litres"
        unique_id: zone_4_total_litres_sensor
        unit_of_measurement: "L"
        device_class: water
        state_class: total_increasing
        icon: mdi:water-outline
        state: "{{ states('input_number.zone_4_total_litres') | float(0) }}"
