  # ── 1. Fetch today's daily forecast ──────────────────────────────
  # Stop here if reduced water mode is active — that cycle runs on its own trigger
  - if:
      - condition: template
        value_template: >-
          {{ reduced_water_mode != '' and
             states(reduced_water_mode) in ['on'] }}
    then:
      - stop: "Normal morning cycle suppressed — reduced water mode is active"

  - alias: "Fetch daily weather forecast"
    service: weather.get_forecasts
    target:
      entity_id: "{{ weather_entity }}"
    data:
      type: daily
    response_variable: weather_response

  # ── 2. Derive shared forecast variables ──────────────────────────
  - alias: "Parse forecast — precipitation and day type"
    variables:
      _today: "{{ weather_response[weather_entity]['forecast'][0] }}"
      today_precipitation: "{{ _today.precipitation | default(0) | float(0) }}"
      today_high_temp: "{{ _today.temperature | default(20) | float(20) }}"
      rain_skip: "{{ today_precipitation >= (rain_threshold | float(0)) }}"
      day_type: >-
        {% if today_high_temp < (temperature_cool_max | float(15)) %}
          cool
        {% elif today_high_temp >= (temperature_hot_min | float(28)) %}
          hot
        {% else %}
          warm
        {% endif %}

  - alias: "Store morning forecast for evening check"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ morning_forecast_cache != '' }}"
        sequence:
          # Cache format: date=YYYY-MM-DD;high=...;precipitation=...;day_type=...;rain_skip=true|false
          # Stored values come from numeric weather fields and the fixed cool/warm/hot enum.
          - service: input_text.set_value
            target:
              entity_id: "{{ morning_forecast_cache }}"
            data:
              value: >-
                {{ 'date=' ~ now().strftime('%Y-%m-%d') ~
                   ';high=' ~ (today_high_temp | string) ~
                   ';precipitation=' ~ (today_precipitation | string) ~
                   ';day_type=' ~ (day_type | trim) ~
                   ';rain_skip=' ~ ('true' if (today_precipitation >= (rain_threshold | float(0))) else 'false') }}

  # ── 3. Abort if too much rain is forecast ────────────────────────
  - alias: "Skip all watering — rain threshold exceeded"
    choose:
      - conditions:
          - condition: template
            value_template: "{{ rain_skip }}"
        sequence:
          - alias: "Notify — rain skip"
            service: persistent_notification.create
            data:
              title: "🌧 Garden Watering — Skipped (Rain)"
