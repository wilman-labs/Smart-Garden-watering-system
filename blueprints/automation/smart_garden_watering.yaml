              ⏭ Skipped — soil moisture {{ rw_z1_moisture_val | round(0) | int }}% above {{ zone_1_moisture_skip_threshold }}%
            {% elif not (rw_z1_interval_due | bool(false)) and not (rw_z1_force_water | bool(false)) %}
              ⏭ Skipped — {{ rw_z1_days_elapsed | round(0) | int }} days into a {{ zone_1_watering_interval_days }} day cycle
            {% else %}
              💧 Watered {{ rw_z1_duration }} min ({{ rw_day_type | trim }} day, {{ reduced_water_food_zone_percent }}% of normal)
            {% endif %}
          rw_z1_moisture_line: >-
            {% if zone_1_moisture_sensor != '' and rw_z1_moisture_val >= 0 %}
              Moisture : {{ rw_z1_moisture_val | round(0) | int }}%
            {% elif zone_1_moisture_sensor != '' %}
              Moisture : sensor unavailable
            {% else %}
              Moisture : no sensor
            {% endif %}

