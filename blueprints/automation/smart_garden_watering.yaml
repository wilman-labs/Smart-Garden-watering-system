                              - conditions:
                                  - condition: template
                                    value_template: "{{ zone_4_last_watered != '' }}"
                                sequence:
                                  - service: input_datetime.set_datetime
                                    target:
                                      entity_id: "{{ zone_4_last_watered }}"
                                    data:
                                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      # ── Reduced — post-watering moisture update ──────────────────
      - alias: "Reduced — update moisture lines post-watering"
        variables:
          rw_z1_moisture_end: >-
            {% if zone_1_moisture_sensor != '' and
                  states(zone_1_moisture_sensor) not in ['unknown', 'unavailable'] %}
              {{ states(zone_1_moisture_sensor) | float(-1) }}
            {% else %}
              -1
            {% endif %}
          rw_z1_moisture_line: >-
            {% if rw_z1_should_water and zone_1_moisture_sensor != '' and rw_z1_moisture_val >= 0 %}
              Moisture : {{ rw_z1_moisture_val | round(0) | int }}% → {{ rw_z1_moisture_end | round(0) | int }}%
            {% elif zone_1_moisture_sensor != '' and rw_z1_moisture_val >= 0 %}
              Moisture : {{ rw_z1_moisture_val | round(0) | int }}%
            {% elif zone_1_moisture_sensor != '' %}
              Moisture : sensor unavailable
            {% else %}
              Moisture : no sensor
            {% endif %}
          rw_z2_moisture_end: >-
            {% if zone_2_moisture_sensor != '' and
                  states(zone_2_moisture_sensor) not in ['unknown', 'unavailable'] %}
              {{ states(zone_2_moisture_sensor) | float(-1) }}
            {% else %}
              -1
            {% endif %}
          rw_z2_moisture_line: >-
            {% if rw_z2_should_water and zone_2_moisture_sensor != '' and rw_z2_moisture_val >= 0 %}
              Moisture : {{ rw_z2_moisture_val | round(0) | int }}% → {{ rw_z2_moisture_end | round(0) | int }}%
            {% elif zone_2_moisture_sensor != '' and rw_z2_moisture_val >= 0 %}
