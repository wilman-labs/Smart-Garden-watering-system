# ── Action ───────────────────────────────────────────────────────────
action:

  # ── Determine trigger ─────────────────────────────────────────────
  - variables:
      _trigger_id: "{{ trigger.id | default('morning') }}"

  # ════════════════════════════════════════════════════════════════
  # REDUCED WATER CONSUMPTION CYCLE (2.5 h before sunrise)
  # ════════════════════════════════════════════════════════════════
  - if:
      - condition: template
        value_template: "{{ _trigger_id == 'reduced_morning' }}"
    then:

      # Stop immediately if the reduced-mode switch is not configured or not ON
      - if:
          - condition: template
            value_template: >-
              {{ reduced_water_mode == '' or
                 states(reduced_water_mode) not in ['on'] }}
        then:
          - stop: "Reduced morning trigger — reduced water mode is not active"

      # Fetch today's daily forecast
      - alias: "Reduced — fetch daily weather forecast"
        service: weather.get_forecasts
        target:
          entity_id: "{{ weather_entity }}"
        data:
          type: daily
        response_variable: rw_weather_response

      # Parse forecast
      - alias: "Reduced — parse forecast"
        variables:
          _rw_today: "{{ rw_weather_response[weather_entity]['forecast'][0] }}"
          rw_precipitation: "{{ _rw_today.precipitation | default(0) | float(0) }}"
          rw_high_temp: "{{ _rw_today.temperature | default(20) | float(20) }}"
          rw_day_type: >-
            {% if rw_high_temp < (temperature_cool_max | float(15)) %}
              cool
            {% elif rw_high_temp >= (temperature_hot_min | float(28)) %}
              hot
            {% else %}
              warm
            {% endif %}
          rw_rain_skip: "{{ rw_precipitation >= (rain_threshold | float(0)) }}"

      # Stop if rain threshold exceeded
      - if:
          - condition: template
            value_template: "{{ rw_rain_skip }}"
        then:
          - alias: "Reduced — notify rain skip"
            service: persistent_notification.create
            data:
              title: "🌧 Garden Watering — Reduced Mode Skipped (Rain)"
              notification_id: garden_watering_reduced
              message: |-
                🌿 Reduced water consumption mode — all zones skipped today.

                🌧 Forecast rain: {{ rw_precipitation }} mm — threshold: {{ rain_threshold }} mm
                🌡 Forecast high: {{ rw_high_temp }}°C
          - alias: "Reduced — notify rain skip (custom service)"
            choose:
              - conditions:
                  - condition: template
                    value_template: "{{ notify_target != '' }}"
                sequence:
                  - service: "{{ notify_target }}"
                    data:
                      title: "🌧 Garden Watering — Reduced Mode Skipped (Rain)"
                      message: |-
                        🌿 Reduced water consumption mode — all zones skipped today.
                        🌧 Forecast rain: {{ rw_precipitation }} mm — threshold: {{ rain_threshold }} mm
                        🌡 Forecast high: {{ rw_high_temp }}°C
          - stop: "Reduced mode — rain threshold exceeded"

      # ── Evaluate each zone ──────────────────────────────────────
      - alias: "Reduced — Zone 1 evaluate"
        variables:
          rw_z1_moisture_val: >-
            {% if zone_1_moisture_sensor != '' and
                  states(zone_1_moisture_sensor) not in ['unknown', 'unavailable'] %}
              {{ states(zone_1_moisture_sensor) | float(-1) }}
            {% else %}
              -1
            {% endif %}
          rw_z1_days_elapsed: >-
            {% if zone_1_last_watered != '' and
                  states(zone_1_last_watered) not in ['unknown', 'unavailable', ''] %}
              {% set rw_z1_last_watered_dt = as_datetime(states(zone_1_last_watered), default=none) %}
              {% if rw_z1_last_watered_dt is not none %}
                {{ (now().date() - as_local(rw_z1_last_watered_dt).date()).days }}
              {% else %}
                999
              {% endif %}
            {% else %}
              999
            {% endif %}
          rw_z1_interval_due: "{{ rw_z1_days_elapsed >= (zone_1_watering_interval_days | int(2)) }}"
          rw_z1_force_water: >-
            {% set thr = zone_1_moisture_water_threshold | int(0) %}
            {% if rw_z1_moisture_val >= 0 and thr > 0 %}
              {{ rw_z1_moisture_val < thr }}
            {% else %}
              false
            {% endif %}
          rw_z1_skip_moisture: >-
            {% set thr = zone_1_moisture_skip_threshold | int(0) %}
            {% if rw_z1_moisture_val >= 0 and thr > 0 %}
              {{ rw_z1_moisture_val > thr }}
            {% else %}
              false
            {% endif %}
          rw_z1_base_duration: >-
            {% if rw_day_type | trim == 'cool' %}
              {{ zone_1_cool_duration | int(5) }}
            {% elif rw_day_type | trim == 'hot' %}
              {{ zone_1_hot_duration | int(15) }}
            {% else %}
              {{ zone_1_warm_duration | int(10) }}
            {% endif %}
          rw_z1_duration: >-
            {{ [1, ((rw_z1_base_duration | int) * (reduced_water_food_zone_percent | int(50)) / 100) | round | int] | max }}
          rw_z1_should_water: >-
            {{ (zone_1_enabled | bool(false))
               and (zone_1_valve != '')
               and (zone_1_is_food_zone | bool(false))
               and ((rw_z1_interval_due | bool(false)) or (rw_z1_force_water | bool(false)))
