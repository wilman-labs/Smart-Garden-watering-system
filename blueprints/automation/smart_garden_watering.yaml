      # ── Reduced — summary notification ───────────────────────────
      - alias: "Reduced — build summary message"
        variables:
          _rw_summary: |-
            🌿 REDUCED WATER CONSUMPTION MODE — {{ reduced_water_food_zone_percent }}% of normal duration
            📅 {{ now().strftime('%Y-%m-%d %H:%M') }}
            🌡 Forecast: {{ rw_high_temp }}°C ({{ rw_day_type | trim }} day)
            🌧 Rain: {{ rw_precipitation }} mm
            ℹ Food zones watered at {{ reduced_water_food_zone_percent }}% — non-food zones skipped — no evening check
            {%- set ns = namespace(parts=[]) -%}
            {%- if zone_1_enabled | bool(false) -%}
            {%- set z1_label = (zone_1_name | trim) or 'Zone 1' -%}
            {%- set z1_ml = rw_z1_moisture_line | trim -%}
            {%- set ns.parts = ns.parts + [z1_label + ': ' + (rw_z1_result | trim) + ('\n' + z1_ml if z1_ml else '')] -%}
            {%- endif -%}
            {%- if zone_2_enabled | bool(false) -%}
            {%- set z2_label = (zone_2_name | trim) or 'Zone 2' -%}
            {%- set z2_ml = rw_z2_moisture_line | trim -%}
            {%- set ns.parts = ns.parts + [z2_label + ': ' + (rw_z2_result | trim) + ('\n' + z2_ml if z2_ml else '')] -%}
            {%- endif -%}
            {%- if zone_3_enabled | bool(false) -%}
            {%- set z3_label = (zone_3_name | trim) or 'Zone 3' -%}
            {%- set z3_ml = rw_z3_moisture_line | trim -%}
