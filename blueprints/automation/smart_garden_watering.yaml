  # ════════════════════════════════════════════════════════════════
  # EVENING HOT-DAY CHECK (runs only on the evening time trigger)
  # ════════════════════════════════════════════════════════════════
  - if:
      - condition: template
        value_template: "{{ _trigger_id == 'evening' }}"
    then:

      # Stop immediately when reduced mode is active — no evening watering
      - if:
          - condition: template
            value_template: >-
              {{ reduced_water_mode != '' and
                 states(reduced_water_mode) in ['on'] }}
        then:
          - stop: "Evening check — reduced water mode is active, evening watering disabled"

      # Read the stored morning forecast classification
      - alias: "Evening — read stored morning forecast"
        variables:
          _today_key: "{{ now().strftime('%Y-%m-%d') }}"
          # Safe defaults mirror the live forecast fallbacks used below.
          eve_high_temp: 20
          eve_precipitation: 0
          eve_day_type: "warm"
          eve_rain_skip: false
          eve_forecast_source: "live"
          eve_forecast_note: ""
          _morning_cache_raw: >-
            {% if morning_forecast_cache != '' and has_value(morning_forecast_cache) %}
              {{ states(morning_forecast_cache) }}
            {% else %}
              {{ '' }}
            {% endif %}
          _morning_cache_parts: >-
            {{ _morning_cache_raw.split(';') if _morning_cache_raw != '' else [] }}
          # Expected order:
          # 0=date=YYYY-MM-DD
          # 1=high=<number>
          # 2=precipitation=<number>
          # 3=day_type=cool|warm|hot
          # 4=rain_skip=true|false
          # Numeric fields are written from morning forecast floats; the float
          # defaults below are defensive if the helper is edited manually.
          # Cached data is treated as valid only for the current date; stale or
          # future-dated cache entries automatically fall back to the live
          # evening forecast path.
          morning_cache_valid: >-
            {{ (_morning_cache_parts | count) == 5
               and _morning_cache_parts[0].startswith('date=')
               and _morning_cache_parts[0].split('=', 1)[1] == _today_key
               and _morning_cache_parts[1].startswith('high=')
               and _morning_cache_parts[2].startswith('precipitation=')
               and _morning_cache_parts[3].startswith('day_type=')
               and _morning_cache_parts[3].split('=', 1)[1] in ['cool', 'warm', 'hot']
               and _morning_cache_parts[4].startswith('rain_skip=')
               and _morning_cache_parts[4].split('=', 1)[1] in ['true', 'false'] }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ morning_cache_valid }}"
            sequence:
              - alias: "Evening — use stored morning forecast"
                variables:
                  eve_high_temp: >-
                    {{ _morning_cache_parts[1].split('=', 1)[1] | float(20) }}
                  eve_precipitation: >-
                    {{ _morning_cache_parts[2].split('=', 1)[1] | float(0) }}
                  eve_day_type: >-
                    {{ _morning_cache_parts[3].split('=', 1)[1] | trim }}
                  eve_rain_skip: "{{ eve_precipitation >= (rain_threshold | float(0)) }}"
                  eve_forecast_source: "morning"
                  eve_forecast_note: ""
        default:
          - alias: "Evening — fetch daily weather forecast"
            service: weather.get_forecasts
            target:
              entity_id: "{{ weather_entity }}"
            data:
              type: daily
            response_variable: eve_weather_response
          - alias: "Evening — parse forecast"
            variables:
              _eve_today: "{{ eve_weather_response[weather_entity]['forecast'][0] }}"
              eve_precipitation: "{{ _eve_today.precipitation | default(0) | float(0) }}"
              eve_high_temp: "{{ _eve_today.temperature | default(20) | float(20) }}"
              eve_day_type: >-
                {% if eve_high_temp < (temperature_cool_max | float(15)) %}
                  cool
                {% elif eve_high_temp >= (temperature_hot_min | float(28)) %}
                  hot
                {% else %}
                  warm
                {% endif %}
              eve_rain_skip: "{{ eve_precipitation >= (rain_threshold | float(0)) }}"
              eve_forecast_source: "live"
              eve_forecast_note: >-
                {% if morning_forecast_cache == '' %}
                  Using live evening forecast — morning cache helper not configured.
                {% elif _morning_cache_raw == '' %}
                  Using live evening forecast — morning cache helper has no usable value.
                {% else %}
                  Using live evening forecast — morning cache was stale or malformed.
                {% endif %}

      # Stop if it's not a hot day — no evening watering needed
      - if:
          - condition: template
            value_template: "{{ eve_day_type | trim != 'hot' }}"
        then:
          - stop: "Evening check — not a hot day, no evening watering"

      # Stop if the chosen forecast exceeded the rain threshold
      - if:
          - condition: template
            value_template: "{{ eve_rain_skip }}"
        then:
          - stop: "Evening check — rain threshold exceeded, skipping"

      # ── Zone 1 — evaluate evening watering decision ──────────────
      - alias: "Zone 1 — evaluate evening watering decision"
        variables:
          z1_eve_moisture_val: >-
            {% if zone_1_moisture_sensor != '' and
                  states(zone_1_moisture_sensor) not in ['unknown', 'unavailable'] %}
              {{ states(zone_1_moisture_sensor) | float(-1) }}
            {% else %}
              -1
            {% endif %}
          z1_eve_sensor_ok: "{{ z1_eve_moisture_val >= 0 }}"
          z1_eve_moisture_wet: >-
            {% set thr = zone_1_moisture_skip_threshold | int(0) %}
            {% if z1_eve_sensor_ok and thr > 0 %}
              {{ z1_eve_moisture_val > thr }}
            {% else %}
              false
            {% endif %}
          z1_eve_should_water: >-
            {{ (zone_1_enabled | bool(false))
               and (zone_1_valve != '')
               and not (z1_eve_moisture_wet | bool(false))
               and (
                 z1_eve_sensor_ok or
                 (zone_1_evening_water_no_sensor | bool(true))
               ) }}
          z1_eve_duration: "{{ zone_1_hot_evening_duration | int(8) }}"
          z1_eve_result: >-
            {% if not (zone_1_enabled | bool(false)) %}
              ⏭ Disabled
            {% elif zone_1_valve == '' %}
              ⏭ No valve configured
            {% elif z1_eve_moisture_wet | bool(false) %}
              ⏭ Skipped — moisture {{ z1_eve_moisture_val | round(0) | int }}% above {{ zone_1_moisture_skip_threshold }}%
            {% elif not z1_eve_sensor_ok and not (zone_1_evening_water_no_sensor | bool(true)) %}
              ⏭ Skipped — no sensor and evening no-sensor watering disabled
            {% else %}
              💧 Watered {{ z1_eve_duration }} min (hot day evening)
            {% endif %}
          z1_eve_moisture_line: >-
            {% if z1_eve_sensor_ok %}
              Moisture : {{ z1_eve_moisture_val | round(0) | int }}%
            {% elif zone_1_moisture_sensor != '' %}
              Moisture : sensor unavailable
            {% else %}
              Moisture : no sensor
            {% endif %}

      # ── Zone 2 — evaluate evening watering decision ──────────────
      - alias: "Zone 2 — evaluate evening watering decision"
        variables:
          z2_eve_moisture_val: >-
            {% if zone_2_moisture_sensor != '' and
                  states(zone_2_moisture_sensor) not in ['unknown', 'unavailable'] %}
              {{ states(zone_2_moisture_sensor) | float(-1) }}
            {% else %}
              -1
            {% endif %}
          z2_eve_sensor_ok: "{{ z2_eve_moisture_val >= 0 }}"
          z2_eve_moisture_wet: >-
            {% set thr = zone_2_moisture_skip_threshold | int(0) %}
            {% if z2_eve_sensor_ok and thr > 0 %}
              {{ z2_eve_moisture_val > thr }}
            {% else %}
              false
            {% endif %}
          z2_eve_should_water: >-
            {{ (zone_2_enabled | bool(false))
               and (zone_2_valve != '')
               and not (z2_eve_moisture_wet | bool(false))
               and (
                 z2_eve_sensor_ok or
                 (zone_2_evening_water_no_sensor | bool(true))
               ) }}
          z2_eve_duration: "{{ zone_2_hot_evening_duration | int(8) }}"
          z2_eve_result: >-
            {% if not (zone_2_enabled | bool(false)) %}
              ⏭ Disabled
            {% elif zone_2_valve == '' %}
              ⏭ No valve configured
            {% elif z2_eve_moisture_wet | bool(false) %}
              ⏭ Skipped — moisture {{ z2_eve_moisture_val | round(0) | int }}% above {{ zone_2_moisture_skip_threshold }}%
            {% elif not z2_eve_sensor_ok and not (zone_2_evening_water_no_sensor | bool(true)) %}
              ⏭ Skipped — no sensor and evening no-sensor watering disabled
            {% else %}
              💧 Watered {{ z2_eve_duration }} min (hot day evening)
            {% endif %}
          z2_eve_moisture_line: >-
            {% if z2_eve_sensor_ok %}
              Moisture : {{ z2_eve_moisture_val | round(0) | int }}%
            {% elif zone_2_moisture_sensor != '' %}
              Moisture : sensor unavailable
            {% else %}
              Moisture : no sensor
            {% endif %}

      # ── Zone 3 — evaluate evening watering decision ──────────────
      - alias: "Zone 3 — evaluate evening watering decision"
        variables:
          z3_eve_moisture_val: >-
            {% if zone_3_moisture_sensor != '' and
                  states(zone_3_moisture_sensor) not in ['unknown', 'unavailable'] %}
              {{ states(zone_3_moisture_sensor) | float(-1) }}
            {% else %}
              -1
            {% endif %}
          z3_eve_sensor_ok: "{{ z3_eve_moisture_val >= 0 }}"
          z3_eve_moisture_wet: >-
            {% set thr = zone_3_moisture_skip_threshold | int(0) %}
            {% if z3_eve_sensor_ok and thr > 0 %}
              {{ z3_eve_moisture_val > thr }}
            {% else %}
              false
            {% endif %}
          z3_eve_should_water: >-
            {{ (zone_3_enabled | bool(false))
               and (zone_3_valve != '')
               and not (z3_eve_moisture_wet | bool(false))
               and (
                 z3_eve_sensor_ok or
                 (zone_3_evening_water_no_sensor | bool(true))
               ) }}
          z3_eve_duration: "{{ zone_3_hot_evening_duration | int(8) }}"
          z3_eve_result: >-
            {% if not (zone_3_enabled | bool(false)) %}
              ⏭ Disabled
            {% elif zone_3_valve == '' %}
              ⏭ No valve configured
            {% elif z3_eve_moisture_wet | bool(false) %}
              ⏭ Skipped — moisture {{ z3_eve_moisture_val | round(0) | int }}% above {{ zone_3_moisture_skip_threshold }}%
            {% elif not z3_eve_sensor_ok and not (zone_3_evening_water_no_sensor | bool(true)) %}
              ⏭ Skipped — no sensor and evening no-sensor watering disabled
            {% else %}
              💧 Watered {{ z3_eve_duration }} min (hot day evening)
            {% endif %}
          z3_eve_moisture_line: >-
            {% if z3_eve_sensor_ok %}
              Moisture : {{ z3_eve_moisture_val | round(0) | int }}%
            {% elif zone_3_moisture_sensor != '' %}
              Moisture : sensor unavailable
            {% else %}
              Moisture : no sensor
            {% endif %}

      # ── Zone 4 — evaluate evening watering decision ──────────────
      - alias: "Zone 4 — evaluate evening watering decision"
        variables:
          z4_eve_moisture_val: >-
            {% if zone_4_moisture_sensor != '' and
                  states(zone_4_moisture_sensor) not in ['unknown', 'unavailable'] %}
              {{ states(zone_4_moisture_sensor) | float(-1) }}
            {% else %}
              -1
            {% endif %}
          z4_eve_sensor_ok: "{{ z4_eve_moisture_val >= 0 }}"
          z4_eve_moisture_wet: >-
            {% set thr = zone_4_moisture_skip_threshold | int(0) %}
            {% if z4_eve_sensor_ok and thr > 0 %}
              {{ z4_eve_moisture_val > thr }}
            {% else %}
              false
            {% endif %}
          z4_eve_should_water: >-
            {{ (zone_4_enabled | bool(false))
               and (zone_4_valve != '')
               and not (z4_eve_moisture_wet | bool(false))
               and (
                 z4_eve_sensor_ok or
                 (zone_4_evening_water_no_sensor | bool(true))
               ) }}
          z4_eve_duration: "{{ zone_4_hot_evening_duration | int(8) }}"
          z4_eve_result: >-
            {% if not (zone_4_enabled | bool(false)) %}
              ⏭ Disabled
            {% elif zone_4_valve == '' %}
              ⏭ No valve configured
            {% elif z4_eve_moisture_wet | bool(false) %}
              ⏭ Skipped — moisture {{ z4_eve_moisture_val | round(0) | int }}% above {{ zone_4_moisture_skip_threshold }}%
            {% elif not z4_eve_sensor_ok and not (zone_4_evening_water_no_sensor | bool(true)) %}
